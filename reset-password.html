<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña | The Porcelain Skin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f0eb;
      color: #5e493e;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #fffaf6;
      border: 1px solid #dfd1c6;
      border-radius: 22px;
      padding: 34px 26px;
      box-shadow: 0 10px 35px rgba(94, 73, 62, 0.10);
      text-align: center;
    }

    .star {
      font-size: 30px;
      color: #b38e6d;
      margin-bottom: 10px;
    }

    h1 {
      font-family: Georgia, serif;
      font-weight: normal;
      margin: 0 0 8px;
      font-size: 29px;
    }

    .brand {
      color: #846e5d;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 26px;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: #846e5d;
      margin-bottom: 24px;
    }

    label {
      display: block;
      text-align: left;
      margin: 15px 0 7px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d7c8bc;
      border-radius: 10px;
      background: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #b38e6d;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #846e5d;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #a33d3d;
    }

    .success {
      color: #55705a;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #a18d7f;
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="star">✦</div>

    <h1>Nueva contraseña</h1>

    <div class="brand">
      The Porcelain Skin
    </div>

    <p>
      Crea una nueva contraseña para volver a acceder
      a tu panel de administración.
    </p>

    <form id="resetForm">

      <label for="password">
        Nueva contraseña
      </label>

      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">
        Confirmar contraseña
      </label>

      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button id="resetButton" type="submit">
        Guardar nueva contraseña
      </button>

      <div id="message"></div>

    </form>

    <div class="footer">
      @theporcelainskin
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://aedtqbpueeyvxoowttkn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_Zl2a0N40GakZakvzUfcufg_yvcTIrI_";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );
let recoveryReady = false;

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" && session) {
    recoveryReady = true;
    console.log("Recovery session ready");
  }
});
    const resetForm =
      document.getElementById("resetForm");

    const resetButton =
      document.getElementById("resetButton");

    const message =
      document.getElementById("message");

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "";
      message.className = "";

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent =
          "La contraseña debe tener al menos 8 caracteres.";
        message.className = "error";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent =
          "Las contraseñas no coinciden.";
        message.className = "error";
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = "Guardando...";

      const { error } =
        await supabaseClient.auth.updateUser({
          password: password
        });

      if (error) {
        console.error(error);

        message.textContent =
          "El enlace no es válido o ha expirado. Solicita uno nuevo desde el inicio de sesión.";

        message.className = "error";

        resetButton.disabled = false;
        resetButton.textContent =
          "Guardar nueva contraseña";

        return;
      }

      message.textContent =
        "✓ Contraseña actualizada correctamente.";

      message.className = "success";

      resetButton.textContent = "¡Listo!";

      setTimeout(async () => {
        await supabaseClient.auth.signOut();
        window.location.href = "admin.html";
      }, 1800);
    });
  </script>

</body>
</html>
